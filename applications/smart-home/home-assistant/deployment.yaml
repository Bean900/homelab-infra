apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO-Volume + hostNetwork-Port 8123: nie zwei Pods gleichzeitig
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      # Home Assistant schaltet die Steckdose von nipogi -> darf NIEMALS auf nipogi laufen
      # (nipogi ist getainted, HA hat keine Toleration; der Selector macht es zusaetzlich explizit).
      nodeSelector:
        homelab.lab/role: always-on
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-config
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              cd /config
              [ -f configuration.yaml ] || cp /defaults/configuration.yaml configuration.yaml
              [ -f automations.yaml ] || echo "[]" > automations.yaml
              [ -f scripts.yaml ]     || echo "{}" > scripts.yaml
              [ -f scenes.yaml ]      || echo "[]" > scenes.yaml
          volumeMounts:
            - name: config
              mountPath: /config
            - name: defaults
              mountPath: /defaults
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          securityContext:
            capabilities:
              add: ["NET_RAW"]    # ping/ARP-basierte Integrationen
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: defaults
          configMap:
            name: home-assistant-defaults

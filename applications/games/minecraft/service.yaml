apiVersion: v1
kind: Service
metadata:
  name: minecraft-headless
  labels:
    app.kubernetes.io/name: minecraft
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-external
  labels:
    app.kubernetes.io/name: minecraft
  annotations:
    # Shares the existing kube-vip address with AdGuard DNS; ports are different (25565 vs 53).
    kube-vip.io/loadbalancerIPs: "192.168.178.99"
spec:
  type: LoadBalancer
  # Cluster routes traffic to the Pod even if it is not on the node holding the VIP.
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP

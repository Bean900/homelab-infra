apiVersion: v1
kind: Service
metadata:
  name: minecraft-headless
  labels:
    app.kubernetes.io/name: minecraft
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-external
  labels:
    app.kubernetes.io/name: minecraft
  annotations:
    kube-vip.io/loadbalancerIPs: "192.168.178.100"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP

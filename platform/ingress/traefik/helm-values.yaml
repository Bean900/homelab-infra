# Werte für den offiziellen Traefik-Helm-Chart (v41.x)
# https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml

deployment:
  replicas: 2 # HA: 2 Pods für rolling updates ohne Downtime

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# --- Entrypoints -------------------------------------------------
ports:
  web:
    port: 8000
    exposedPort: 80
    # HTTP wird immer auf HTTPS umgeleitet
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 8443
    exposedPort: 443
    http:
      tls:
        enabled: true 
        
tlsStore:
  default:
    defaultCertificate:
      secretName: lab-wildcard-tls

# --- Service (kube-vip vergibt hier die externe VIP) --------------
service:
  spec:
    type: LoadBalancer
  annotations:
    kube-vip.io/loadbalancerIPs: "192.168.178.100"

# --- Provider -------------------------------------------------------
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
  kubernetesIngress:
    enabled: true

# --- Dashboard (abgesichert über Middleware, siehe ingressroute-dashboard.yaml) ---
api:
  dashboard: true
  insecure: false

ingressRoute:
  dashboard:
    enabled: false # eigene IngressRoute wird separat via kustomize resources ausgerollt

# --- Logging & Metrics ---------------------------------------------
log:
  level: INFO

accessLog:
  enabled: true

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
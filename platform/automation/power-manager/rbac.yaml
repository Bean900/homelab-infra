apiVersion: v1
kind: ServiceAccount
metadata:
  name: power-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: power-manager
rules:
  # Node lesen + cordon/uncordon + Annotation (Modus, Drain-Marker)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  # Pods lesen (Pending/Burst-Pods, Requests, Drain-Fortschritt)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Pods sauber evicten (respektiert PodDisruptionBudgets)
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # CPU/RAM der Nodes
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Longhorn: Node bereit? Volumes noch attached?
  - apiGroups: ["longhorn.io"]
    resources: ["nodes", "volumes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: power-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: power-manager
subjects:
  - kind: ServiceAccount
    name: power-manager
    namespace: power-manager

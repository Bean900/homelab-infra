# Talos erzeugt daraus ein Secret gleichen Namens mit einer talosconfig (Rolle os:operator),
# die der Power-Manager fuer "talosctl shutdown" nutzt.
# Voraussetzung: KubeTalosAPIAccessConfig in talos/patch.yaml (allowedKubernetesNamespaces: power-manager).
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: power-manager-talos
spec:
  roles:
    - os:operator

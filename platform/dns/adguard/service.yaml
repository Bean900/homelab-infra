apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
  namespace: adguard
  annotations:
    kube-vip.io/loadbalancerIPs: 192.168.178.100
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: adguard
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
---
# Interner Service fuer die Web-UI (wird von ingressroute-adguard.yaml referenziert;
# fehlte bisher -> Traefik lieferte 503)
apiVersion: v1
kind: Service
metadata:
  name: adguard-web
  namespace: adguard
spec:
  type: ClusterIP
  selector:
    app: adguard
  ports:
    - name: web
      port: 80
      protocol: TCP
      targetPort: web

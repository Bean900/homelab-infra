apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: "HP260G4"
---
apiVersion: v1alpha1
kind: KubeletConfig
$patch: delete
---
machine:
  disks:
    - device: /dev/nvme0n1
      partitions:
        - mountpoint: /var/lib/longhorn
  kubelet:
    extraMounts:
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options:
          - bind
          - rshared
          - rw
---
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
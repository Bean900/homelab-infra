apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main-pg-cluster
  namespace: database
spec:
  # Raise this only after Longhorn replicas are distributed across three nodes.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  enableSuperuserAccess: false
  enablePDB: true
  bootstrap:
    initdb:
      database: platform
      owner: platform_owner
      secret:
        name: cnpg-platform-owner
      dataChecksums: true
  storage:
    size: 20Gi
    storageClass: longhorn-single
  managed:
    roles:
      - name: keycloak
        ensure: present
        comment: Production login role for Keycloak only
        login: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassRLS: false
        connectionLimit: 50
        passwordSecret:
          name: keycloak-db-credentials
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: seaweedfs-backups
        serverName: main-pg-cluster
  resources:
    requests:
      cpu: "500m"
      memory: 1Gi
    limits:
      memory: 2Gi

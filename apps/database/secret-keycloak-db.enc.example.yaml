# Copy to secret-keycloak-db.enc.yaml and encrypt it with SOPS before the first sync.
# The password must be identical to apps/keycloak/secret-keycloak.enc.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-credentials
  namespace: database
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: keycloak
  password: REPLACE_WITH_A_RANDOM_32_CHARACTER_PASSWORD

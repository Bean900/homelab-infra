apiVersion: v1
kind: Service
metadata:
  name: adguard-svc
  namespace: network
  annotations:
    kube-vip.io/loadbalancerIPs: "192.168.168.60"
spec:
  type: LoadBalancer
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: web
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: adguard
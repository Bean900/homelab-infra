apiVersion: v1
kind: Service
metadata:
  name: adguard-service
  namespace: network
spec:
  selector:
    app.kubernetes.io/name: adguard
  ports:
    - name: web
      protocol: TCP
      port: 3000
      targetPort: web-alt

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adguard
  namespace: network
  labels:
    app.kubernetes.io/name: adguard
spec:
  selector:
    matchLabels:
      app: adguard
  serviceName: "adguard"
  replicas: 1
  minReadySeconds: 30
  template:
    metadata:
      labels:
        app: adguard
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: adguard
        image: adguard/adguardhome:v0.107.76
        ports:
        - containerPort: 53 # DNS
          name: dns
          protocol: UDP
        - containerPort: 53 # DNS
          name: dns
          protocol: TCP
        - containerPort: 67 # DHCP
          name: dhcp
          protocol: UDP
        - containerPort: 68 # DHCP
          name: dhcp
          protocol: UDP
        - containerPort: 80 # AdGuard Home Web Interface
          name: web
          protocol: TCP
        - containerPort: 443 # AdGuard Home Web Interface (HTTPS)
          name: web-https
          protocol: TCP
        - containerPort: 443 # AdGuard Home Web Interface (HTTPS)
          name: web-https
          protocol: UDP
        - containerPort: 784 # DNS over QUIC
          name: dns-quic
          protocol: UDP
        - containerPort: 853 # DNS over TLS
          name: dns-tls
          protocol: UDP
        - containerPort: 3000 # AdGuard Home Web Interface (alternative)
          name: web-alt
          protocol: TCP
        - containerPort: 5443 # DNSCrypt
          name: dnscrypt
          protocol: UDP
        - containerPort: 5443 # DNSCrypt
          name: dnscrypt
          protocol: TCP
        - containerPort: 8853 # DNS over QUIC
          name: dns-quic-2
          protocol: UDP
        volumeMounts:
        - name: adguard-work
          mountPath: /opt/adguardhome/work
        - name: adguard-conf
          mountPath: /opt/adguardhome/conf
      volumes:
      - name: adguard-conf
        persistentVolumeClaim:
          claimName: adguard-conf-pvc
      - name: adguard-work
        persistentVolumeClaim:
          claimName: adguard-work-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-conf-pvc
  namespace: network
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-work-pvc
  namespace: network
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

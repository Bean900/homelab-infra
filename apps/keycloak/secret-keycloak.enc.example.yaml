# Copy to secret-keycloak.enc.yaml and encrypt it with SOPS before the first sync.
# db-password must equal database/secret-keycloak-db.enc.yaml's password.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-credentials
  namespace: keycloak
type: Opaque
stringData:
  db-username: keycloak
  db-password: REPLACE_WITH_A_RANDOM_32_CHARACTER_PASSWORD
  bootstrap-admin-username: REPLACE_WITH_A_NON_DEFAULT_ADMIN_USERNAME
  bootstrap-admin-password: REPLACE_WITH_A_RANDOM_32_CHARACTER_PASSWORD

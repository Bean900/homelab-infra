apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip-ds
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: kube-vip
  template:
    metadata:
      labels:
        name: kube-vip
    spec:
      hostNetwork: true
      serviceAccountName: kube-vip  
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v0.8.2
          imagePullPolicy: Always
          args:
            - manager 
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          env:
            - name: vip_arp
              value: "true"
            - name: vip_leaderelection
              value: "true"
            - name: lb_enable
              value: "true"
            - name: lb_port
              value: "6443"
            - name: svc_enable
              value: "true" 
            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
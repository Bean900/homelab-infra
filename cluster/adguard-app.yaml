apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard
  namespace: gitops # Wichtig: Erlaubter App-Namespace
spec:
  project: default
  source:
    repoURL: 'https://github.com/Bean900/homelab-infra.git'
    path: apps/adguard
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gitops # Speicherort für AdGuard-Ressourcen
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
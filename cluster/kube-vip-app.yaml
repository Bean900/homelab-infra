apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-vip
  namespace: argocd  
spec:
  project: default
  source:
    repoURL: 'https://github.com/Bean900/homelab-infra.git'
    path: apps/kube-vip
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
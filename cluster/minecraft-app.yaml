apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Bean900/homelab-infra.git'
    path: apps/games/minecraft
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: games
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age
      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.5.1
          command: ["/usr/local/bin/ksops", "install", "/custom-tools"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
      containers:
        - name: argocd-repo-server
          env:
            - name: XDG_CONFIG_HOME
              value: /custom-tools
            - name: SOPS_AGE_KEY_FILE
              value: /home/argocd/sops-age/keys.txt
            - name: KUSTOMIZE_PLUGIN_HOME
              value: /custom-tools/kustomize/plugin
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
            - name: sops-age
              mountPath: /home/argocd/sops-age
              readOnly: true
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform workloads
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/Bean900/homelab-infra.git
        revision: HEAD
        directories:
          - path: platform/*/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: platform
      source:
        repoURL: https://github.com/Bean900/homelab-infra.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # CRDs/Resources aus anderen Apps (z.B. cert-manager, Traefik, Talos-ServiceAccount)
          # existieren beim ersten Sync evtl. noch nicht -> kein Dry-Run-Fehler
          - SkipDryRunOnMissingResource=true
        # Ohne retry versucht ArgoCD einen fehlgeschlagenen Auto-Sync fuer denselben Commit
        # NICHT erneut. Beim Neu-Deploy (Reihenfolge der Apps ist zufaellig) ist das fatal.
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
